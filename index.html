<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuicIt-Grocery Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
          <header>
           <div class="logo"><span>Quick</span><span class="green">It</span></div>

        <div class="delivery">
            <h3>Delivery in 12 minutes</h3>
                  <p>Agra Fort, Rakabganj, Agra, Uttar Pradesh ▼</p>
        </div>

        <input type="text" class="search"
                   placeholder="Search for products...">

        <a href="#" class="login">Login</a>

       
<button class="cart">
    <img src="image3.png" alt="">
    <span>My Cart</span>
</button>

    </header>

    <main>

        <section class="banner">
            <img src="image1.jpg" alt="Daily grocery essentials">
            
        </section>

        <section class="offers">
            <div class="offer">
  <img src="pharmacy-WEB.avif" alt="Pharmacy">
            </div>

            <div class="offer">
        <img src="pet_crystal_WEB-1.avif" alt="Pet care supplies">
            </div>

            <div class="offer">
        <img src="baby_crystal_WEB-1.avif" alt="Baby care">
            </div>
        </section>

        <section class="categories">

            <div class="category">
                <img src="paan-corner_web.avif" alt="Paan">
              
            </div>

            <div class="category">
                <img src="Slice-2_10.avif" alt="Dairy and bread">
                
            </div>

            <div class="category">
          <img src="fruitandveges.avif" alt="Fruits and vegetables">
                
            </div>

            <div class="category">
                   <img src="colddrink.avif" alt="Cold drinks">
              
            </div>

            <div class="category">
                   <img src="snacks.avif" alt="Snacks">
               
            </div>

            <div class="category">
                    <img src="breakfast.avif" alt="Breakfast">
              
            </div>

            <div class="category">
        <img src="sweet.avif" alt="Sweets">
                
            </div>

            <div class="category">
                <img src="bakery.avif" alt="Bakery">
                
            </div>

            <div class="category">
       <img src="teacoffee.avif" alt="Tea and coffee">
                
            </div>

            <div class="category">
                      <img src="attta.avif" alt="Atta and rice">
               
            </div>

        </section>

    </main>

</body>
</html>
